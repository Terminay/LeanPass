name: Update download badge

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pypistats
        run: pip install pypistats

      - name: Compute real (non-null) downloads
        run: |
          # Run from a temp dir so pypistats doesn't mistake the repo's
          # ./leanpass source folder for a "package dir" to inspect.
          mkdir -p /tmp/badge-check
          cd /tmp/badge-check

          pypistats python_minor leanpass --format json > raw.json
          cat raw.json

          python3 - <<'EOF'
          import json

          with open("raw.json") as f:
              data = json.load(f)["data"]

          real_downloads = sum(
              d["downloads"] for d in data if d["category"] != "null"
          )

          badge = {
              "schemaVersion": 1,
              "label": "downloads",
              "message": str(real_downloads),
              "color": "blue",
          }

          with open("badge.json", "w") as f:
              json.dump(badge, f)

          print(f"Real downloads this period: {real_downloads}")
          EOF

          # Move the result back into the repo checkout
          cp badge.json "$GITHUB_WORKSPACE/badge.json"

      - name: Commit badge.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badge.json
          git diff --cached --quiet || git commit -m "Update download badge"
          git push
